# Not to be a replica
replicaof no one

# Allow connections from all addresses (this is safe within Docker)
bind 0.0.0.0

# Disable secure mode (otherwise Redis may reject connections)
protected-mode no

# Logging
loglevel notice
logfile ""

# Snapshots (optional)
save 900 1
save 300 10
save 60 10000

# Dump file and working directory
dbfilename dump.rdb
dir /data